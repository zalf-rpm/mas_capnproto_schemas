[project]
name = "zalfmas-capnp-schemas"
version = "0.1.66"
description = ""
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{ name = "Michael Berg-Mohnicke", email = "michael.berg@zalf.de" }]
dependencies = ["pycapnp>=2.2.3,<3"]

[dependency-groups]
dev = [
  "capnp-stub-generator @ git+https://github.com/zalf-rpm/capnp-stub-generator.git",
  "ruff>=0.15.16,<0.16",
  "ty>=0.0.44,<0.0.45",
]

[tool.pixi.feature.dev.dependencies]
pixi-pycharm = ">=0.0.11,<0.0.12"

[tool.pixi.environments]
dev = ["dev"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]
preview = ["pixi-build"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
only-include = ["gen/python"]
sources = ["gen/python"]
